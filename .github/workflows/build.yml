name: Build GhostBoost 1.7.10

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract GhostBoost source
        run: |
          unzip -o GhostBoost-1.7.10-Beta-1.5-GITHUB-ROOT.zip -d .

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Show project files
        run: |
          echo "=== GhostBoost project root ==="
          ls -la
          echo "=== Source files ==="
          find src -type f | head -100

      - name: Build GhostBoost
        run: |
          gradle build --stacktrace --info

      - name: Show generated JARs
        if: always()
        run: |
          echo "=== build/libs ==="
          find build/libs -maxdepth 1 -type f -name "*.jar" -print 2>/dev/null || true

      - name: Upload GhostBoost JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GhostBoost-1.7.10-Beta-1.5
          path: build/libs/*.jar
          if-no-files-found: error
